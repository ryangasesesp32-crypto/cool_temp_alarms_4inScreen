name: Publish Freenove v1.35 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-v1-35-draft-release.yml"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Freenove v1.35 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "freenove-v1.35" >/dev/null 2>&1; then
            gh release edit "freenove-v1.35" \
              --draft=false \
              --title "Freenove Cooling Alarm v1.35 — Smart Navigation & 18px Minimum UI" \
              --notes "Source v1.35: smart PREV/NEXT, 18px minimum fonts with ellipses, simplified C1/C2 time buttons, and yellow SETTINGS with black text. The Sketch_13.1_LVGL.ino.bin release asset is attached. Its source correspondence and hardware behavior have not been independently verified here; test on the spare Freenove before deploying to onsite hardware."
          else
            gh release create "freenove-v1.35" \
              --target main \
              --title "Freenove Cooling Alarm v1.35 — Smart Navigation & 18px Minimum UI" \
              --notes "Source v1.35 available. Compiled Sketch_13.1_LVGL.ino.bin not yet attached; OTA not ready."
          fi
